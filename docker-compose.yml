# Production stack for one Ubuntu VPS.
# The app is only on 127.0.0.1:3000. Caddy is the public HTTPS front.
# WhatsApp backup stays off until: docker compose --profile whatsapp up -d --build

services:
  excel-jobs:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # .env may say ./data for a laptop. Inside the container the disk is /data.
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - excel-jobs-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-info@excelroofing.ca}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - excel-jobs
    restart: unless-stopped

  backup:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      WHATSAPP_DIR: /whatsapp
    volumes:
      - excel-jobs-data:/data
      - whatsapp-backup-data:/whatsapp
      - ./deploy/rclone:/config/rclone:ro
    entrypoint: ["/app/scripts/backup-offsite.sh"]
    restart: unless-stopped

  # Spare-phone WhatsApp backup. Off unless you ask for it.
  # Create whatsapp-backup/.env first. See whatsapp-backup/README.md.
  whatsapp-backup:
    profiles: ["whatsapp"]
    build: ./whatsapp-backup
    env_file:
      - path: ./whatsapp-backup/.env
        required: false
    environment:
      # .env may say ./data or HOST=127.0.0.1 for a laptop.
      # Inside the container the disk is /data. The port is published only on 127.0.0.1.
      DATA_DIR: /data
      HOST: "0.0.0.0"
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - whatsapp-backup-data:/data
    restart: unless-stopped

volumes:
  excel-jobs-data:
  whatsapp-backup-data:
  caddy-data:
  caddy-config:
