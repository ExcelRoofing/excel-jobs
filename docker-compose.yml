services:
  excel-jobs:
    build: .
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATA_DIR: /data
      DEMO_HINTS: ${DEMO_HINTS:-on}
      COOKIE_SECURE: ${COOKIE_SECURE:-off}
      DRIVE_SYNC: ${DRIVE_SYNC:-off}
      STORAGE: ${STORAGE:-local}
    volumes:
      - excel-jobs-data:/data
    restart: unless-stopped

  # Spare-phone WhatsApp backup. Off unless you ask for it:
  #   docker compose --profile whatsapp up -d --build
  # Create whatsapp-backup/.env first. See whatsapp-backup/README.md.
  whatsapp-backup:
    profiles: ["whatsapp"]
    build: ./whatsapp-backup
    env_file:
      - path: ./whatsapp-backup/.env
        required: false
    environment:
      DATA_DIR: /data
      HOST: "0.0.0.0"
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - whatsapp-backup-data:/data
    restart: unless-stopped

volumes:
  excel-jobs-data:
  whatsapp-backup-data:
